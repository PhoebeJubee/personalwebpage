al">游戏时光</h1><div class="mt-1 mb-2 text-base text-neutral-500 dark:text-neutral-400 print:hidden"><div class="flex flex-row flex-wrap items-center"></div></div><script type=text/javascript src=/js/page.min.54b6f4371722649edbe871e431d8670d670878c22be8f36e229fe53cc9b786fe25a834def5e6de621f7a3e37b72bc8cd73839aa5ed907ed6cbd45cd3e1b0fa20.js integrity="sha512-VLb0NxciZJ7b6HHkMdhnDWcIeMIr6PNuIp/lPMm3hv4lqDTe9ebeYh96Pje3K8jNc4Oape2QftbL1FzT4bD6IA==" data-oid=views_timeline/_index.md data-oid-likes=likes_timeline/_index.md></script></header><section class="mt-0 prose flex max-w-full flex-col dark:prose-invert lg:flex-row"><div class="min-w-0 min-h-0 max-w-prose"><p>这里展示我的游戏记录和评分数据。</p><script>const BANGUMI_DATA_URL="/data/bangumi.json";function scoreColor(e){return e>=8?{bg:"#d4edda",fg:"#155724"}:e>=6?{bg:"#fff3cd",fg:"#856404"}:{bg:"#f8d7da",fg:"#721c24"}}function escapeHtml(e){return String(e??"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#39;")}function renderGameCard(e){const t=e.name_cn||e.name||"",s=e.name&&e.name!==t?e.name:"",n=e.rate||0,a=(e.tags||[]).slice(0,5),o=e.cover||"",i=scoreColor(n);return`
    <div style="background: white; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); padding: 16px; margin-bottom: 16px; display: flex; gap: 16px;">
      ${o?`<img src="${escapeHtml(o)}" alt="${escapeHtml(t)}" style="width: 96px; height: 128px; object-fit: cover; border-radius: 4px;">`:""}
      <div style="flex: 1;">
        <div style="font-size: 18px; font-weight: bold; margin-bottom: 8px;">${escapeHtml(t)}</div>
        ${s?`<div style="font-size: 12px; color: #666; margin-bottom: 4px;">${escapeHtml(s)}</div>`:""}
        ${e.date?`<div style="font-size: 14px; color: #666; margin-bottom: 4px;">发售日: ${escapeHtml(e.date)}</div>`:""}
        ${n>0?`<div style="margin-bottom: 8px;">我的评分: <span style="background: ${i.bg}; color: ${i.fg}; padding: 2px 8px; border-radius: 4px; font-weight: 500;">${n}/10</span></div>`:""}
        <div style="margin-top: 8px;">
          ${a.map(e=>`<span style="display: inline-block; padding: 2px 8px; margin: 2px 4px 2px 0; border-radius: 12px; font-size: 12px; background: #e3f2fd; color: #1565c0;">${escapeHtml(e)}</span>`).join("")}
        </div>
      </div>
    </div>
  `}function renderStats(e){const s=e.length,t=e.filter(e=>e.rate>0),o=t.length?t.reduce((e,t)=>e+t.rate,0)/t.length:0,i=t.filter(e=>e.rate>=9).length,a=e.filter(e=>e.updated_at&&new Date(e.updated_at).getFullYear()===(new Date).getFullYear()).length,n=(e,t)=>`
    <div style="background: linear-gradient(135deg, #e3f2fd 0%, #f3e5f5 100%); border-radius: 8px; padding: 16px; text-align: center;">
      <div style="font-size: 32px; font-weight: bold; color: #1976d2;">${e}</div>
      <div style="font-size: 14px; color: #666; margin-top: 4px;">${t}</div>
    </div>`;return`
    <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 16px; margin-bottom: 32px;">
      ${n(s,"总游戏数")}
      ${n(o.toFixed(1),"平均评分")}
      ${n(i,"神作 (9+)")}
      ${n(a,"今年游玩")}
    </div>
  `}async function loadBangumiData(){const e=document.getElementById("bangumi-timeline");try{const n=await fetch(BANGUMI_DATA_URL,{cache:"no-store"});if(!n.ok)throw new Error("HTTP "+n.status);const t=await n.json();if(!Array.isArray(t)||t.length===0){e.innerHTML='<p style="color: #666;">暂无游戏记录，请先运行 scripts/fetch_bangumi.py 抓取数据。</p>';return}e.innerHTML=renderStats(t)+t.map(renderGameCard).join("")}catch(t){console.error("加载 Bangumi 数据失败:",t),e.innerHTML=`
      <div style="background: #fff3cd; border: 1px solid #ffc107; border-radius: 8px; padding: 16px;">
        <p style="color: #856404; font-weight: 500;">数据加载失败</p>
        <p style="color: #856404; font-size: 14px; margin-top: 8px;">请确认已运行脚本生成 static/data/bangumi.json，且已重新构建站点。</p>
        <p style="color: #856404; font-size: 12px; margin-top: 4px;">错误: ${t.message}</p>
      </div>
    `}}document.addEventListener("DOMContentLoaded",loadBangumiData)</script><div id=bangumi-timeline><p style=color:#666>正在加载游戏记录...</p></div></div></section><section class="mt-10 prose dark:prose-invert"><p class="py-8 border-t"><em></em></p></section><div id=top-scroller class="pointer-events-none absolute top-[110vh] bottom-0 w-12 ltr:right-0 rtl:left-0 z-10"><a href=#the-top class="pointer-events-auto sticky top-[calc(100vh-5.5rem)] flex h-12 w-12 mb-16 items-center justify-center rounded-full bg-neutral/50 text-xl text-neutral-700 hover:text-primary-600 dark:bg-neutral-800/50 dark:text-neutral dark:hover:text-primary-400" aria-label title>&uarr;</a></div></main><footer id=site-footer class="py-10 print:hidden"><div class="flex items-center justify-between"><p class="text-sm text-neutral-500 dark:text-neutral-400">&copy;
